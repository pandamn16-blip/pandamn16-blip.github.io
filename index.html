
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <meta name="description" content="Something is coming. 22 November 2026, 19:30 UTC.">
  <title>Something is coming...</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffdf9c;
      --cream: #fff0ca;
      --bg: #0a0710;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-width: 290px;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--cream);
    }

    .page {
      position: relative;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      isolation: isolate;
      overflow: hidden;
    }

    .art {
      position: absolute;
      inset: 0;
      z-index: -2;
    }

    .art picture,
    .art img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .art img {
      object-fit: cover;
      object-position: center;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        #09050c42 0%,
        transparent 30%,
        transparent 66%,
        #09050c62 100%
      );
    }

    header {
      grid-row: 1;
      align-self: center;
      text-align: center;
      padding: max(26px, env(safe-area-inset-top)) 16px 8px;
    }

    h1 {
      margin: 0;
      font: 600 clamp(31px, 4.5vw, 72px)/1.2
        'Cinzel', Georgia, serif;
      letter-spacing: -.025em;
      color: var(--cream);
      text-shadow:
        0 3px 24px #09020ed9,
        0 0 24px #b8613633;
    }

    .rule {
      margin: clamp(13px, 2vw, 25px) auto
              clamp(13px, 2vw, 23px);
      width: min(345px, 60vw);
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #f2cb82,
        transparent
      );
      position: relative;
    }

    .rule::after {
      content: '✦';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 0 15px;
      color: #ffca6d;
      background: #120a16;
      font-size: 18px;
      line-height: 1;
    }

    .date {
      margin: 0;
      font: 600 clamp(14px, 1.8vw, 22px)/1.4
        'Cinzel', Georgia, serif;
      letter-spacing: .14em;
      color: var(--gold);
      text-shadow: 0 2px 16px #000;
    }

    .spacer {
      grid-row: 2;
      min-height: clamp(200px, 26vh, 390px);
      pointer-events: none;
    }

    .bottom {
      grid-row: 3;
      align-self: center;
      text-align: center;
      padding: 12px 16px max(27px, env(safe-area-inset-bottom));
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.5vw, 18px);
      max-width: 680px;
      margin: 0 auto;
    }

    .unit-box {
      min-width: 0;
      padding: clamp(10px, 2vw, 20px) 3px
               clamp(12px, 1.9vw, 17px);
      border-radius: clamp(10px, 1.4vw, 17px);
      border: 1px solid #f5bc5eb3;
      background: #190f19d4;
      box-shadow:
        0 0 28px #f1a64d13,
        inset 0 0 18px #f3bb6814;
      backdrop-filter: blur(7px);
    }

    .number {
      display: block;
      font: 600 clamp(28px, 5vw, 59px)/1.12
        'Cinzel', Georgia, serif;
      font-variant-numeric: tabular-nums;
      color: #fff0cc;
    }

    .unit {
      display: block;
      margin-top: 6px;
      color: #f7d5ae;
      font: 600 clamp(9px, 1.05vw, 12px)/1.3
        'DM Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: .13em;
    }

    .credits {
      font: 500 11px/1.6 'DM Sans', sans-serif;
      letter-spacing: .07em;
      color: #dec9bf;
      margin: clamp(16px, 2vw, 30px) 0 0;
      text-shadow: 0 1px 14px #000;
    }

    .credits strong {
      color: #f5d393;
      font-weight: 600;
    }

    [hidden] {
      display: none !important;
    }

    .open {
      display: inline-block;
      padding: 14px 25px;
      color: #271223;
      background: linear-gradient(130deg, #ffe6ae, #e9af58);
      border: 1px solid #ffecbb;
      border-radius: 10px;
      text-decoration: none;
      font: 700 16px 'Cinzel', Georgia, serif;
    }

    .open:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    /* Portrait / mobile layout */
    @media (max-aspect-ratio: 4/5) {
      .art img {
        object-position: center center;
      }

      header {
        padding-bottom: 0;
      }

      h1 {
        font-size: clamp(27px, 7vw, 51px);
      }

      .date {
        font-size: clamp(12px, 3vw, 17px);
        letter-spacing: .08em;
      }

      .spacer {
        min-height: clamp(180px, 27vh, 340px);
      }

      .countdown {
        max-width: 540px;
      }

      .number {
        font-size: clamp(27px, 7vw, 49px);
      }

      .unit {
        font-size: 9px;
        letter-spacing: .05em;
      }

      .credits {
        font-size: 10px;
      }
    }

    /* Short landscape screens */
    @media (max-height: 640px) {
      header {
        padding-top: 10px;
      }

      h1 {
        font-size: clamp(25px, 4vw, 40px);
      }

      .rule {
        margin: 9px auto;
      }

      .spacer {
        min-height: min(24vh, 145px);
      }

      .bottom {
        padding-bottom: 10px;
      }

      .unit-box {
        padding: 7px 2px;
      }

      .number {
        font-size: clamp(23px, 3vw, 32px);
      }

      .credits {
        margin-top: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- Desktop and mobile teaser artwork -->
    <div class="art" aria-hidden="true">
      <picture>
        <source
          media="(max-aspect-ratio: 4/5)"
          srcset="./SpoilerPortrait.png"
        >
        <img
          src="./SpoilerLandscape.png"
          alt=""
          fetchpriority="high"
        >
      </picture>
    </div>

    <div class="vignette" aria-hidden="true"></div>

    <!-- Headline -->
    <header>
      <h1>Something is coming...</h1>

      <div class="rule" aria-hidden="true"></div>

      <p class="date">22.11.26 · 19:30 UTC</p>
    </header>

    <!-- Keeps the llama artwork unobstructed -->
    <div class="spacer" aria-hidden="true"></div>

    <!-- Countdown -->
    <section class="bottom" aria-label="Countdown to launch">

      <div
        id="countdown"
        class="countdown"
        role="timer"
        aria-label="Time remaining until 22 November 2026 at 19:30 UTC"
      >
        <div class="unit-box">
          <span class="number" id="days">00</span>
          <span class="unit">Days</span>
        </div>

        <div class="unit-box">
          <span class="number" id="hours">00</span>
          <span class="unit">Hours</span>
        </div>

        <div class="unit-box">
          <span class="number" id="minutes">00</span>
          <span class="unit">Minutes</span>
        </div>

        <div class="unit-box">
          <span class="number" id="seconds">00</span>
          <span class="unit">Seconds</span>
        </div>
      </div>

      <!-- Shown if redirect is delayed -->
      <a
        id="play"
        class="open"
        href="/llamaknight/"
        hidden
      >
        Play LlamaKnight
      </a>

      <p class="credits">
        A <strong>Bread Production</strong>
        · Special thanks to
        <strong>RosieBear</strong>
        for her invaluable help.
      </p>

    </section>
  </main>

  <script>
    (() => {
      'use strict';

      // Sunday 22 November 2026 at 19:30 UTC.
      const launchTime = Date.parse('2026-11-22T19:30:00Z');

      // Keep the game itself untouched.
      const destination = '/llamaknight/';

      const ids = ['days', 'hours', 'minutes', 'seconds'];

      const countdown = document.getElementById('countdown');
      const play = document.getElementById('play');

      let lastText = '';

      function tick() {
        const remaining = Math.max(
          0,
          Math.ceil((launchTime - Date.now()) / 1000)
        );

        // Automatically send visitors to the game at launch.
        if (remaining <= 0) {
          countdown.hidden = true;
          play.hidden = false;

          document.title = 'LlamaKnight — Play Now';

          window.location.replace(destination);
          return;
        }

        const values = [
          Math.floor(remaining / 86400),
          Math.floor((remaining % 86400) / 3600),
          Math.floor((remaining % 3600) / 60),
          remaining % 60
        ];

        const valueText = values.join(':');

        if (lastText !== valueText) {
          ids.forEach((id, i) => {
            document.getElementById(id).textContent =
              String(values[i]).padStart(2, '0');
          });

          lastText = valueText;
        }
      }

      tick();
      setInterval(tick, 1000);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) tick();
      });

    })();
  </script>
</body>
</html>
